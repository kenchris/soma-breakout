<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            touch-action: none; /* no panning/pinch-zoom on mobile */
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #hud {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 10px;
            font-size: 1.5em;
            user-select: none;
        }
        #hud-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hud-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00bcd4;
            color: #ffffff;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.7em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .hud-btn:hover {
            background: rgba(0, 188, 212, 0.3);
        }
        #combo {
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            transition: filter 0.2s;
        }
        #combo-label {
            min-width: 1.6em;
            font-weight: bold;
            color: #FFD700;
        }
        #combo-pips {
            display: flex;
            gap: 3px;
        }
        #combo-pips i {
            width: 9px;
            height: 16px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.1s, box-shadow 0.1s;
        }
        #combo-pips i.on:nth-child(1) { background: #00e5ff; }
        #combo-pips i.on:nth-child(2) { background: #4de08c; }
        #combo-pips i.on:nth-child(3) { background: #FFD700; }
        #combo-pips i.on:nth-child(4) { background: #FF9A2E; }
        #combo-pips i.on:nth-child(5) { background: #FF4D4D; }
        #combo-pips i.on { box-shadow: 0 0 6px currentColor; }
        #combo.bump { animation: comboBump 0.25s ease-out; }
        #combo.max #combo-label { color: #FF4D4D; }
        #combo.max { filter: drop-shadow(0 0 6px #FF4D4D); }
        @keyframes comboBump {
            0% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        /* The stage wraps canvas + overlay so the overlay centres on the canvas itself */
        #stage {
            position: relative;
            display: flex;
            justify-content: center;
            max-width: 100%;
        }
        #canvas {
            display: block;
            box-sizing: border-box; /* so max-width: 100% includes the border and never overflows a phone screen */
            border: 2px solid #00bcd4;
            background-color: #000000;
            cursor: none; /* Hide default cursor over canvas */
            max-width: 100%;
            max-height: calc(100vh - 150px); /* always fits viewport (HUD above, legend below), keeps 3:2 ratio */
            max-height: calc(100dvh - 150px); /* mobile: excludes the browser toolbar */
            touch-action: none;
        }
        /* Keys + powerup legend, below the playfield */
        #controls {
            width: 100%;
            max-width: 900px;
            margin-top: 10px;
            color: #8b93a8;
            font-size: 0.8em;
            text-align: center;
            user-select: none;
        }
        #controls .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
        }
        #controls .row + .row { margin-top: 8px; }
        #controls kbd {
            font: inherit;
            font-size: 0.9em;
            color: #d5dbeb;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            padding: 0 5px;
            margin-right: 3px;
        }
        #controls .pu { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        #controls .pu i {
            display: inline-grid;
            place-items: center;
            min-width: 18px;
            height: 18px;
            padding: 0 3px;
            box-sizing: border-box;
            border-radius: 9px;
            background: var(--c, #7a1010);
            color: #ffffff;
            font-style: normal;
            font-size: 10px;
            font-weight: bold;
        }
        #controls .pu.tnt i { border-radius: 4px; color: #ffe14d; }
        @media (max-width: 600px) {
            #hud { font-size: 0.9em; flex-wrap: wrap; gap: 6px; }
            #controls { font-size: 0.75em; }
            #overlay { font-size: 1.2em; padding: 18px 28px; }
        }
        @media (pointer: coarse) {
            .hud-btn { min-height: 40px; padding: 6px 12px; } /* finger-sized tap targets */
            #overlay-button { min-height: 44px; }
            #controls .keys { display: none; } /* no keyboard on a touch screen */
        }
        @media (max-height: 500px) {
            #overlay { font-size: 1em; padding: 12px 22px; }
            #overlay-stats { margin: 6px auto 2px; }
            #controls { display: none; } /* landscape phone: every pixel goes to the playfield */
            #canvas {
                max-height: calc(100vh - 90px);
                max-height: calc(100dvh - 90px);
            }
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 24px 40px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.6em;
            display: none; /* Hidden by default */
            z-index: 10;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #overlay-flag {
            display: none;
            color: #FFD700;
            font-weight: bold;
            font-size: 0.8em;
            margin: 2px 0 6px;
            animation: flagPulse 1s ease-in-out infinite;
        }
        @keyframes flagPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        #overlay-stats {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 420px;
            margin: 10px auto 4px;
        }
        #overlay-stats .stat {
            display: flex;
            flex-direction: column;
            min-width: 92px;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
        }
        #overlay-stats .stat b { font-size: 0.95em; }
        #overlay-stats .stat span { font-size: 0.5em; color: #9aa4b2; }
        #overlay-button {
            display: inline-block;
            background: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #overlay-button:hover {
            background: #00e5ff;
            transform: scale(1.04);
        }
        #overlay-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div id="score">Score: 0</div>
            <div id="lives">Lives: &#9679;&#9679;&#9679;</div>
            <div id="level">Level: 1</div>
            <div id="best">Best: 0</div>
            <div id="combo" title="Combo multiplier: chain bricks without touching the paddle">
                <span id="combo-label">&times;1</span>
                <span id="combo-pips"><i></i><i></i><i></i><i></i><i></i></span>
            </div>
            <div id="hud-actions">
                <button id="mute-btn" class="hud-btn" title="Mute sound and vibration (M)">🔊 Sound</button>
                <button id="pause-btn" class="hud-btn" title="Pause / Resume (P)">⏸ Pause</button>
                <button id="fullscreen-btn" class="hud-btn" title="Fullscreen & Lock Landscape (F)">⛶ Fullscreen</button>
            </div>
        </div>
        <div id="stage">
            <canvas id="canvas" width="900" height="600"></canvas>
            <div id="overlay">
                <p id="overlay-message" style="margin: 0 0 10px 0;">Press SPACE to launch</p>
                <div id="overlay-flag">&#9733; New high score! &#9733;</div>
                <div id="overlay-stats"></div>
                <button id="overlay-button">Launch</button>
            </div>
        </div>
        <div id="controls">
            <div class="row keys">
                <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> / drag move</span>
                <span><kbd>Space</kbd> / tap launch &amp; release</span>
                <span><kbd>P</kbd> pause</span>
                <span><kbd>R</kbd> restart</span>
                <span><kbd>M</kbd> mute</span>
                <span><kbd>F</kbd> fullscreen</span>
            </div>
            <div class="row legend">
                <span class="pu" style="--c:#33cc33"><i>+</i>Life</span>
                <span class="pu" style="--c:#cc33cc"><i>S</i>Slow</span>
                <span class="pu" style="--c:#ff9900"><i>W</i>Wide</span>
                <span class="pu" style="--c:#ff3366"><i>E</i>Explosive</span>
                <span class="pu" style="--c:#3399ff"><i>M</i>Multi-ball</span>
                <span class="pu" style="--c:#c98f00"><i>&times;2</i>Score</span>
                <span class="pu" style="--c:#22bbdd"><i><svg width="10" height="11" viewBox="0 0 10 11" aria-hidden="true"><path d="M5 0l4 1.5v3.5C9 7.5 7 9.5 5 11 3 9.5 1 7.5 1 5V1.5z" fill="#fff"/></svg></i>Shield</span>
                <span class="pu" style="--c:#ff6a00"><i>F</i>Fire ball</span>
                <span class="pu" style="--c:#7cb518"><i>G</i>Sticky</span>
                <span class="pu" style="--c:#a06cff"><i>A</i>Guided</span>
                <span class="pu tnt"><i>TNT</i>chain-explodes</span>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
